# The reproducible corpus artifact.
#
# The PDFs themselves are gitignored: this file plus `research-agent fetch` rebuilds
# the corpus exactly, keeps the repository small, and avoids redistributing anyone
# else's paper (decisions.md D-006).
#
# Corpus trimmed to 11 papers on 2026-08-20 (DPO and Self-RAG removed).
#
# arxiv_id is VERSION-PINNED. A bare id resolves to the latest revision, so an
# unpinned corpus can silently change underneath the gold labels: a new revision
# means a new sha256, new chunk ids, and an evaluation scored against chunks that no
# longer say what they said when they were labelled (decisions.md D-109).
#
# title / first_author / published were read from the arXiv API on 2026-08-20, never
# written from memory. `research-agent fetch --audit` re-checks them against the API.

version: 1
fetched_metadata_on: "2026-08-20"

documents:
