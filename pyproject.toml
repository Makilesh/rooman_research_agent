[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-research-agent"
version = "0.0.1"
description = "Conversational research agent with verifiable, machine-checkable citations"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt, exactly pinned. They are not
# duplicated here: two sources of truth for versions is how a pin silently drifts.
dependencies = []

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a working CUDA device",
    "models: downloads or loads encoder weights",
    "network: touches the network",
]
